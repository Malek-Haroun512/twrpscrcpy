name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 libxcb-cursor0

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -q

      - name: Smoke test the CLI
        run: python -m twrpscrcpy --help

  package:
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Qt system libraries (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 libxcb-cursor0

      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Check the helper binaries are packaged
        run: |
          python -m zipfile -l dist/*.whl | tee wheel.txt
          grep -qE "twrpscrcpy/bin/fbstream-arm64[[:space:]]" wheel.txt
          grep -qE "twrpscrcpy/bin/fbstream-arm[[:space:]]" wheel.txt

      - name: Check the entry point from outside the source tree
        run: |
          python -m pip install --force-reinstall dist/*.whl
          cd "$RUNNER_TEMP"
          python -c "from pathlib import Path; import twrpscrcpy; p = Path(twrpscrcpy.__file__).with_name('bin') / 'fbstream-arm64'; assert p.is_file(), p; print(p)"
          twrpscrcpy --help

      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*
